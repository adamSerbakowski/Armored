services:
  app:
    build:
      context: .
    environment:
      COMPOSER_HOME: /tmp/composer
      DATABASE_URL: mysql://armored:armored@database:3306/armored?serverVersion=8.4.0&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: armored
      MYSQL_PASSWORD: armored
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: armored
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
